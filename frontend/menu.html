<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ruang Belajar</title>

    <link rel="stylesheet" href="/frontend/css/style.css">

    <style>
        :root {
            --bg: #f5f7fb;
            --card: #ffffff;
            --text: #1f2937;
            --muted: #6b7280;
            --border: #e5e7eb;
            --button: #f1f3f5;
            --button-hover: #e5e7eb;
            --bar-bg: #e5e7eb;
            --exp: #f5c542;
        }

        body.dark-mode {
            --bg: #111827;
            --card: #1f2937;
            --text: #f9fafb;
            --muted: #cbd5e1;
            --border: #374151;
            --button: #374151;
            --button-hover: #4b5563;
            --bar-bg: #374151;
            --exp: #facc15;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            min-height: 100%;
        }

        body {
            font-family: Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            transition:
                background-color 0.25s ease,
                color 0.25s ease;
        }

        .menu-page {
            min-height: 100vh;
            padding: 24px;
            background: var(--bg);
            transition: background-color 0.25s ease;
        }

        .menu-container {
            width: 100%;
            max-width: 1000px;
            margin: 0 auto;
        }

        /* =========================
           HEADER
        ========================= */

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 24px;
            margin-bottom: 28px;
        }

        .brand h1 {
            margin: 0;
            color: var(--text);
            font-size: 32px;
            line-height: 1.2;
        }

        .brand p {
            margin: 8px 0 0;
            color: var(--muted);
            font-size: 15px;
        }

        /* =========================
           EXP
        ========================= */

        .exp-box {
            width: 250px;
        }

        .exp-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
            color: var(--text);
            font-size: 14px;
            font-weight: bold;
        }

        .exp-bar {
            width: 100%;
            height: 12px;
            overflow: hidden;
            background: var(--bar-bg);
            border-radius: 999px;
        }

        .exp-fill {
            width: 0%;
            height: 100%;
            background: var(--exp);
            border-radius: 999px;
            transition: width 0.3s ease;
        }

        /* =========================
           MENU
        ========================= */

        .menu-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 18px;
        }

        .menu-card {
            width: 100%;
            min-height: 180px;
            padding: 26px;
            border: 1px solid var(--border);
            border-radius: 20px;
            background: var(--card);
            color: var(--text);
            text-align: left;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.07);

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease,
                background-color 0.25s ease,
                border-color 0.25s ease;
        }

        .menu-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.13);
        }

        body.dark-mode .menu-card {
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
        }

        body.dark-mode .menu-card:hover {
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.45);
        }

        .menu-icon {
            margin-bottom: 14px;
            font-size: 42px;
            line-height: 1;
        }

        .menu-card h2 {
            margin: 0 0 8px;
            color: var(--text);
            font-size: 22px;
        }

        .menu-card p {
            margin: 0;
            color: var(--muted);
            font-size: 15px;
            line-height: 1.5;
        }

        /* =========================
           THEME BUTTON
        ========================= */

        .settings {
            display: flex;
            justify-content: flex-end;
            margin-top: 22px;
        }

        .theme-button {
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 11px 16px;
            background: var(--button);
            color: var(--text);
            font-size: 14px;
            cursor: pointer;

            transition:
                background-color 0.25s ease,
                color 0.25s ease,
                border-color 0.25s ease;
        }

        .theme-button:hover {
            background: var(--button-hover);
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 700px) {

            .menu-page {
                padding: 16px;
            }

            .top-bar {
                flex-direction: column;
                align-items: stretch;
                gap: 20px;
            }

            .brand h1 {
                font-size: 28px;
            }

            .exp-box {
                width: 100%;
            }

            .menu-grid {
                grid-template-columns: 1fr;
                gap: 14px;
            }

            .menu-card {
                min-height: 150px;
                padding: 22px;
            }

            .settings {
                justify-content: stretch;
            }

            .theme-button {
                width: 100%;
            }
        }
    </style>
</head>

<body>

<div class="menu-page">

    <div class="menu-container">

        <!-- HEADER -->

        <div class="top-bar">

            <div class="brand">
                <h1>📚 Ruang Belajar</h1>

                <p>
                    Belajar, latihan, dan berkembang.
                </p>
            </div>


            <!-- EXP -->

            <div class="exp-box">

                <div class="exp-info">

                    <span>
                        ⭐ Level <span id="level">1</span>
                    </span>

                    <span>
                        <span id="exp">0</span> / 100 EXP
                    </span>

                </div>

                <div class="exp-bar">

                    <div
                        id="expFill"
                        class="exp-fill">
                    </div>

                </div>

            </div>

        </div>


        <!-- MENU -->

        <div class="menu-grid">

            <button
                class="menu-card"
                onclick="location.href='/materi'">

                <div class="menu-icon">
                    📚
                </div>

                <h2>
                    Materi
                </h2>

                <p>
                    Tambahkan materi dan pelajari
                    penjelasan dari AI.
                </p>

            </button>


            <button
                class="menu-card"
                onclick="location.href='/game'">

                <div class="menu-icon">
                    🎮
                </div>

                <h2>
                    Latihan
                </h2>

                <p>
                    Belajar sambil bermain dengan
                    Maze, Memory, dan Puzzle.
                </p>

            </button>


            <button
                class="menu-card"
                onclick="location.href='/ujian'">

                <div class="menu-icon">
                    📝
                </div>

                <h2>
                    Ujian
                </h2>

                <p>
                    Uji pemahaman berdasarkan materi
                    yang sudah dipelajari.
                </p>

            </button>


            <button
                class="menu-card"
                onclick="location.href='/koleksi'">

                <div class="menu-icon">
                    🎨
                </div>

                <h2>
                    Koleksi
                </h2>

                <p>
                    Lihat dan kumpulkan skin serta
                    item yang kamu dapatkan.
                </p>

            </button>


            <button
                class="menu-card"
                onclick="location.href='/progres'">

                <div class="menu-icon">
                    📊
                </div>

                <h2>
                    Progres
                </h2>

                <p>
                    Lihat perkembangan belajar,
                    EXP, dan hasil latihanmu.
                </p>

            </button>

        </div>


        <!-- THEME -->

        <div class="settings">

            <button
                id="themeButton"
                class="theme-button"
                type="button"
                onclick="toggleTheme()">

                🌙 Mode Gelap

            </button>

        </div>

    </div>

</div>


<script>

    // =====================================================
    // EXP
    // =====================================================

    function updateEXP() {

        let exp = Number(
            localStorage.getItem("exp") || 0
        );

        if (exp < 0) {
            exp = 0;
        }

        const level =
            Math.floor(exp / 100) + 1;

        const expDalamLevel =
            exp % 100;

        const expElement =
            document.getElementById("exp");

        const levelElement =
            document.getElementById("level");

        const expFill =
            document.getElementById("expFill");


        if (expElement) {
            expElement.textContent =
                expDalamLevel;
        }


        if (levelElement) {
            levelElement.textContent =
                level;
        }


        if (expFill) {
            expFill.style.width =
                expDalamLevel + "%";
        }
    }


    // =====================================================
    // TERAPKAN TEMA
    // =====================================================

    function applyTheme() {

        const theme =
            localStorage.getItem("theme") || "light";

        const button =
            document.getElementById("themeButton");


        if (theme === "dark") {

            document.body.classList.add("dark-mode");

            if (button) {
                button.textContent =
                    "☀️ Mode Terang";
            }

        } else {

            document.body.classList.remove("dark-mode");

            if (button) {
                button.textContent =
                    "🌙 Mode Gelap";
            }
        }
    }


    // =====================================================
    // GANTI TEMA
    // =====================================================

    function toggleTheme() {

        const sedangGelap =
            document.body.classList.contains("dark-mode");


        if (sedangGelap) {

            localStorage.setItem(
                "theme",
                "light"
            );

        } else {

            localStorage.setItem(
                "theme",
                "dark"
            );
        }


        applyTheme();
    }


    // =====================================================
    // MULAI
    // =====================================================

    applyTheme();
    updateEXP();

</script>

</body>
</html>
