<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Progres - Ruang Belajar</title>

    <style>

        :root {

            --bg: #f5f7fb;
            --card: #ffffff;
            --text: #1f2937;
            --muted: #6b7280;
            --border: #e5e7eb;
            --secondary: #eef0f3;
            --accent: #6366f1;
            --exp: #f5c542;

        }


        body.dark-mode {

            --bg: #111827;
            --card: #1f2937;
            --text: #f9fafb;
            --muted: #cbd5e1;
            --border: #374151;
            --secondary: #374151;
            --accent: #818cf8;
            --exp: #facc15;

        }


        * {

            box-sizing: border-box;

        }


        html,
        body {

            margin: 0;
            min-height: 100%;

        }


        body {

            font-family: Arial, sans-serif;

            background: var(--bg);

            color: var(--text);

            transition:
                background-color 0.2s ease,
                color 0.2s ease;

        }


        .page {

            min-height: 100vh;

            padding: 24px;

        }


        .container {

            width: 100%;

            max-width: 1000px;

            margin: 0 auto;

        }


        .top {

            display: flex;

            justify-content: space-between;

            align-items: center;

            gap: 16px;

            margin-bottom: 24px;

        }


        .title h1 {

            margin: 0;

            font-size: 32px;

        }


        .title p {

            margin: 8px 0 0;

            color: var(--muted);

            line-height: 1.5;

        }


        .top-buttons {

            display: flex;

            gap: 10px;

        }


        button {

            border: 0;

            border-radius: 12px;

            padding: 12px 16px;

            background: var(--text);

            color: var(--card);

            font-size: 14px;

            font-weight: bold;

            cursor: pointer;

        }


        button:hover {

            opacity: 0.88;

        }


        .secondary-button {

            background: var(--secondary);

            color: var(--text);

            border: 1px solid var(--border);

        }


        .level-card {

            margin-bottom: 18px;

            padding: 26px;

            border: 1px solid var(--border);

            border-radius: 20px;

            background: var(--card);

        }


        .level-top {

            display: flex;

            justify-content: space-between;

            align-items: center;

            gap: 16px;

            margin-bottom: 16px;

        }


        .level {

            font-size: 28px;

            font-weight: bold;

        }


        .total-exp {

            color: var(--muted);

        }


        .bar {

            width: 100%;

            height: 18px;

            overflow: hidden;

            border-radius: 999px;

            background: var(--secondary);

        }


        .fill {

            width: 0%;

            height: 100%;

            border-radius: 999px;

            background: var(--exp);

            transition: width 0.3s ease;

        }


        .bar-text {

            margin-top: 10px;

            color: var(--muted);

            font-size: 14px;

        }


        .stats {

            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 16px;

            margin-bottom: 18px;

        }


        .stat {

            padding: 22px;

            border: 1px solid var(--border);

            border-radius: 18px;

            background: var(--card);

        }


        .stat-icon {

            font-size: 34px;

            margin-bottom: 10px;

        }


        .stat-value {

            font-size: 26px;

            font-weight: bold;

        }


        .stat-label {

            margin-top: 6px;

            color: var(--muted);

            font-size: 14px;

        }


        .section {

            padding: 24px;

            border: 1px solid var(--border);

            border-radius: 20px;

            background: var(--card);

        }


        .section h2 {

            margin: 0 0 18px;

            font-size: 22px;

        }


        .rows {

            display: grid;

            gap: 12px;

        }


        .row {

            display: flex;

            justify-content: space-between;

            align-items: center;

            gap: 16px;

            padding: 15px;

            border-radius: 12px;

            background: var(--secondary);

        }


        .row strong {

            color: var(--text);

        }


        .row span {

            color: var(--muted);

            text-align: right;

        }


        @media (max-width: 700px) {

            .page {

                padding: 16px;

            }


            .top {

                flex-direction: column;

                align-items: stretch;

            }


            .top-buttons {

                flex-direction: column;

            }


            .top-buttons button {

                width: 100%;

            }


            .stats {

                grid-template-columns: 1fr;

            }


            .level-top {

                flex-direction: column;

                align-items: flex-start;

            }


            .row {

                flex-direction: column;

                align-items: flex-start;

            }


            .row span {

                text-align: left;

            }

        }

    </style>

</head>


<body>

<div class="page">

    <div class="container">


        <div class="top">

            <div class="title">

                <h1>📊 Progres</h1>

                <p>
                    Lihat perkembangan belajar kamu.
                </p>

            </div>


            <div class="top-buttons">

                <button
                    class="secondary-button"
                    type="button"
                    onclick="kembaliKeMenu()"
                >
                    ← Menu
                </button>


                <button
                    class="secondary-button"
                    id="themeButton"
                    type="button"
                    onclick="ubahTema()"
                >
                    🌙 Mode Gelap
                </button>

            </div>

        </div>


        <div class="level-card">

            <div class="level-top">

                <div
                    id="levelText"
                    class="level"
                >
                    ⭐ Level 1
                </div>


                <div
                    id="totalExp"
                    class="total-exp"
                >
                    0 EXP
                </div>

            </div>


            <div class="bar">

                <div
                    id="expFill"
                    class="fill"
                ></div>

            </div>


            <div
                id="barText"
                class="bar-text"
            >
                0 / 100 EXP menuju Level 2
            </div>

        </div>


        <div class="stats">


            <div class="stat">

                <div class="stat-icon">
                    ⭐
                </div>

                <div
                    id="statExp"
                    class="stat-value"
                >
                    0
                </div>

                <div class="stat-label">
                    Total EXP
                </div>

            </div>


            <div class="stat">

                <div class="stat-icon">
                    🏆
                </div>

                <div
                    id="statLevel"
                    class="stat-value"
                >
                    1
                </div>

                <div class="stat-label">
                    Level
                </div>

            </div>


            <div class="stat">

                <div class="stat-icon">
                    🎨
                </div>

                <div
                    id="statSkin"
                    class="stat-value"
                >
                    1
                </div>

                <div class="stat-label">
                    Skin Terbuka
                </div>

            </div>


        </div>


        <div class="section">

            <h2>
                📚 Ringkasan
            </h2>


            <div class="rows">


                <div class="row">

                    <strong>
                        Sistem Level
                    </strong>

                    <span>
                        100 EXP = naik 1 level
                    </span>

                </div>


                <div class="row">

                    <strong>
                        Skin aktif
                    </strong>

                    <span
                        id="skinAktif"
                    >
                        Pelajar
                    </span>

                </div>


                <div class="row">

                    <strong>
                        Skin terbuka
                    </strong>

                    <span
                        id="skinTerbuka"
                    >
                        1 dari 6
                    </span>

                </div>


                <div class="row">

                    <strong>
                        EXP menuju level berikutnya
                    </strong>

                    <span
                        id="expBerikutnya"
                    >
                        100 EXP
                    </span>

                </div>


            </div>

        </div>


    </div>

</div>


<script>


    const skins = [

        {
            id: "default",
            nama: "Pelajar",
            harga: 0
        },

        {
            id: "robot",
            nama: "Robot",
            harga: 50
        },

        {
            id: "wizard",
            nama: "Penyihir",
            harga: 100
        },

        {
            id: "ninja",
            nama: "Ninja",
            harga: 150
        },

        {
            id: "astronaut",
            nama: "Astronaut",
            harga: 200
        },

        {
            id: "scientist",
            nama: "Ilmuwan",
            harga: 250
        }

    ];


    function getExp() {

        const value =
            Number(
                localStorage.getItem("exp") || 0
            );


        if (Number.isNaN(value)) {

            return 0;

        }


        return Math.max(
            0,
            value
        );

    }


    function getOwnedSkins() {

        let owned;


        try {

            owned = JSON.parse(
                localStorage.getItem(
                    "ruangBelajarOwnedSkins"
                ) || "[\"default\"]"
            );

        } catch (error) {

            owned = ["default"];

        }


        if (!Array.isArray(owned)) {

            owned = ["default"];

        }


        if (!owned.includes("default")) {

            owned.unshift("default");

        }


        return owned;

    }


    function updateProgress() {

        const exp =
            getExp();


        const level =
            Math.floor(
                exp / 100
            ) + 1;


        const current =
            exp % 100;


        const owned =
            getOwnedSkins();


        const selected =
            localStorage.getItem(
                "ruangBelajarSkin"
            ) || "default";


        const selectedSkin =
            skins.find(
                function(skin) {

                    return skin.id === selected;

                }
            );


        document.getElementById(
            "levelText"
        ).textContent =
            "⭐ Level " + level;


        document.getElementById(
            "totalExp"
        ).textContent =
            exp + " EXP";


        document.getElementById(
            "statExp"
        ).textContent =
            exp;


        document.getElementById(
            "statLevel"
        ).textContent =
            level;


        document.getElementById(
            "statSkin"
        ).textContent =
            owned.length;


        document.getElementById(
            "expFill"
        ).style.width =
            current + "%";


        document.getElementById(
            "barText"
        ).textContent =
            current +
            " / 100 EXP menuju Level " +
            (level + 1);


        document.getElementById(
            "expBerikutnya"
        ).textContent =
            (100 - current) +
            " EXP";


        document.getElementById(
            "skinAktif"
        ).textContent =
            selectedSkin
                ? selectedSkin.nama
                : "Pelajar";


        document.getElementById(
            "skinTerbuka"
        ).textContent =
            owned.length +
            " dari " +
            skins.length;

    }


    function kembaliKeMenu() {

        window.location.href =
            "/menu";

    }


    function applyTheme() {

        const theme =
            localStorage.getItem(
                "theme"
            ) || "light";


        if (theme === "dark") {

            document.body.classList.add(
                "dark-mode"
            );


            document.getElementById(
                "themeButton"
            ).textContent =
                "☀️ Mode Terang";

        } else {

            document.body.classList.remove(
                "dark-mode"
            );


            document.getElementById(
                "themeButton"
            ).textContent =
                "🌙 Mode Gelap";

        }

    }


    function ubahTema() {

        const current =
            localStorage.getItem(
                "theme"
            ) || "light";


        localStorage.setItem(
            "theme",
            current === "dark"
                ? "light"
                : "dark"
        );


        applyTheme();

    }


    applyTheme();

    updateProgress();


</script>

</body>
</html>
