<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Ujian - Ruang Belajar</title>

    <style>

        :root {

            --bg: #f5f7fb;
            --card: #ffffff;
            --text: #1f2937;
            --muted: #6b7280;
            --border: #e5e7eb;
            --secondary: #eef0f3;
            --button: #111827;
            --button-text: #ffffff;
            --correct: #dcfce7;
            --wrong: #fee2e2;
            --accent: #6366f1;

        }


        body.dark-mode {

            --bg: #111827;
            --card: #1f2937;
            --text: #f9fafb;
            --muted: #cbd5e1;
            --border: #374151;
            --secondary: #374151;
            --button: #f9fafb;
            --button-text: #111827;
            --correct: #14532d;
            --wrong: #7f1d1d;
            --accent: #818cf8;

        }


        * {

            box-sizing: border-box;

        }


        html,
        body {

            margin: 0;
            min-height: 100%;

        }


        body {

            font-family: Arial, sans-serif;

            background: var(--bg);

            color: var(--text);

        }


        .page {

            min-height: 100vh;

            padding: 24px;

        }


        .container {

            width: 100%;

            max-width: 850px;

            margin: 0 auto;

        }


        .top {

            display: flex;

            justify-content: space-between;

            align-items: center;

            gap: 12px;

            margin-bottom: 20px;

        }


        h1 {

            margin: 0;

            font-size: 32px;

        }


        .top-buttons {

            display: flex;

            gap: 8px;

        }


        button {

            border: 0;

            border-radius: 12px;

            padding: 12px 16px;

            background: var(--button);

            color: var(--button-text);

            font-weight: bold;

            cursor: pointer;

        }


        button:hover {

            opacity: 0.88;

        }


        button:disabled {

            cursor: default;

            opacity: 0.65;

        }


        .secondary {

            background: var(--secondary);

            color: var(--text);

            border: 1px solid var(--border);

        }


        .exp-card {

            margin-bottom: 18px;

            padding: 18px;

            border: 1px solid var(--border);

            border-radius: 18px;

            background: var(--card);

        }


        .exp-top {

            display: flex;

            justify-content: space-between;

            gap: 12px;

            margin-bottom: 10px;

            font-weight: bold;

        }


        .exp-bar {

            width: 100%;

            height: 12px;

            overflow: hidden;

            border-radius: 999px;

            background: var(--secondary);

        }


        .exp-fill {

            width: 0%;

            height: 100%;

            background: var(--accent);

            border-radius: 999px;

        }


        .question-card {

            padding: 24px;

            border: 1px solid var(--border);

            border-radius: 20px;

            background: var(--card);

        }


        .question-number {

            color: var(--muted);

            font-size: 14px;

            font-weight: bold;

            margin-bottom: 12px;

        }


        .question {

            margin: 0 0 22px;

            font-size: 21px;

            line-height: 1.5;

        }


        .options {

            display: grid;

            gap: 12px;

        }


        .option {

            width: 100%;

            padding: 16px;

            border: 2px solid var(--border);

            border-radius: 14px;

            background: var(--card);

            color: var(--text);

            text-align: left;

            font-size: 16px;

            line-height: 1.4;

        }


        .option:hover {

            border-color: var(--accent);

        }


        .option.correct {

            background: var(--correct);

            border-color: #22c55e;

        }


        .option.wrong {

            background: var(--wrong);

            border-color: #ef4444;

        }


        .feedback {

            margin-top: 18px;

            padding: 18px;

            border-radius: 14px;

            background: var(--secondary);

            line-height: 1.6;

        }


        .feedback h3 {

            margin-top: 0;

        }


        .next-button {

            margin-top: 16px;

            width: 100%;

        }


        .start-card {

            padding: 28px;

            border: 1px solid var(--border);

            border-radius: 20px;

            background: var(--card);

            text-align: center;

        }


        .start-card p {

            color: var(--muted);

            line-height: 1.6;

        }


        .result {

            padding: 28px;

            border: 1px solid var(--border);

            border-radius: 20px;

            background: var(--card);

            text-align: center;

        }


        .result-score {

            margin: 20px 0;

            font-size: 48px;

            font-weight: bold;

        }


        .result-exp {

            margin-bottom: 20px;

            font-size: 20px;

            font-weight: bold;

        }


        @media (max-width: 600px) {

            .page {

                padding: 16px;

            }


            .top {

                flex-direction: column;

                align-items: stretch;

            }


            .top-buttons {

                flex-direction: column;

            }


            .top-buttons button {

                width: 100%;

            }


            h1 {

                font-size: 28px;

            }


            .question {

                font-size: 18px;

            }

        }

    </style>

</head>


<body>

<div class="page">

    <div class="container">


        <div class="top">

            <h1>📝 Ujian</h1>


            <div class="top-buttons">

                <button
                    class="secondary"
                    type="button"
                    onclick="kembali()"
                >
                    ← Menu
                </button>


                <button
                    class="secondary"
                    id="themeButton"
                    type="button"
                    onclick="ubahTema()"
                >
                    🌙 Mode Gelap
                </button>

            </div>

        </div>


        <div
            id="app"
        ></div>


    </div>

</div>


<script>


let paket = null;

let soal = [];

let nomor = 0;

let benar = 0;

let expDidapat = 0;

let sudahMenjawab = false;


const EXP_PER_JAWABAN = 10;



function getExp() {

    return Number(
        localStorage.getItem("exp") || 0
    );

}



function tambahEXP(jumlah) {

    const sekarang =
        getExp();


    const hasil =
        sekarang + jumlah;


    localStorage.setItem(
        "exp",
        String(hasil)
    );


    expDidapat += jumlah;

}



function updateTheme() {

    const theme =
        localStorage.getItem(
            "theme"
        ) || "light";


    if (theme === "dark") {

        document.body.classList.add(
            "dark-mode"
        );


        document.getElementById(
            "themeButton"
        ).textContent =
            "☀️ Mode Terang";

    } else {

        document.body.classList.remove(
            "dark-mode"
        );


        document.getElementById(
            "themeButton"
        ).textContent =
            "🌙 Mode Gelap";

    }

}



function ubahTema() {

    const sekarang =
        localStorage.getItem(
            "theme"
        ) || "light";


    localStorage.setItem(
        "theme",
        sekarang === "dark"
            ? "light"
            : "dark"
    );


    updateTheme();

}



function kembali() {

    window.location.href =
        "/menu";

}



function loadPaket() {

    const data =
        localStorage.getItem(
            "paketBelajar"
        );


    if (!data) {

        tampilkanBelumAdaPaket();

        return false;

    }


    try {

        paket =
            JSON.parse(data);

    } catch (error) {

        console.error(error);

        tampilkanBelumAdaPaket();

        return false;

    }


    if (
        !paket ||
        !Array.isArray(
            paket.soal_ujian
        ) ||
        paket.soal_ujian.length === 0
    ) {

        tampilkanBelumAdaPaket();

        return false;

    }


    soal =
        shuffle(
            paket.soal_ujian
        );


    return true;

}



function tampilkanBelumAdaPaket() {

    document.getElementById(
        "app"
    ).innerHTML = `

        <div class="start-card">

            <h2>
                📚 Paket ujian belum tersedia
            </h2>

            <p>
                Pelajari materi terlebih dahulu
                agar AI membuat paket belajar.
            </p>

            <button
                type="button"
                onclick="location.href='/materi'"
            >
                📖 Buka Materi
            </button>

        </div>

    `;

}



function tampilkanMulai() {

    const jumlah =
        soal.length;


    document.getElementById(
        "app"
    ).innerHTML = `

        <div class="start-card">

            <h2>
                📝 Siap Ujian?
            </h2>

            <p>
                Ujian ini menggunakan soal
                dari materi yang sudah kamu pelajari.
            </p>

            <p>
                Jumlah soal:
                <strong>
                    ${jumlah}
                </strong>
            </p>

            <p>
                Setiap jawaban benar:
                <strong>
                    +${EXP_PER_JAWABAN} EXP
                </strong>
            </p>

            <button
                type="button"
                onclick="mulaiUjian()"
            >
                🚀 Mulai Ujian
            </button>

        </div>

    `;

}



function mulaiUjian() {

    nomor = 0;

    benar = 0;

    expDidapat = 0;

    sudahMenjawab = false;


    tampilkanSoal();

}



function tampilkanSoal() {

    const item =
        soal[nomor];


    if (!item) {

        selesaiUjian();

        return;

    }


    sudahMenjawab = false;


    const progress =
        (
            nomor /
            soal.length
        ) * 100;


    const pilihan =
        Array.isArray(
            item.pilihan
        )
            ? item.pilihan
            : [];


    let pilihanHTML = "";


    pilihan.forEach(
        function(teks, index) {

            pilihanHTML += `

                <button
                    class="option"
                    type="button"
                    onclick="jawab(${index})"
                >
                    ${escapeHTML(teks)}
                </button>

            `;

        }
    );


    document.getElementById(
        "app"
    ).innerHTML = `

        <div class="exp-card">

            <div class="exp-top">

                <span>
                    ⭐ EXP
                </span>

                <span>
                    ${getExp()} EXP
                </span>

            </div>


            <div class="exp-bar">

                <div
                    class="exp-fill"
                    style="width:${progress}%"
                ></div>

            </div>

        </div>


        <div class="question-card">

            <div class="question-number">

                Soal ${nomor + 1}
                dari ${soal.length}

            </div>


            <h2 class="question">

                ${escapeHTML(
                    item.pertanyaan || ""
                )}

            </h2>


            <div
                id="options"
                class="options"
            >

                ${pilihanHTML}

            </div>


            <div
                id="feedback"
            ></div>

        </div>

    `;

}



function jawab(index) {

    if (sudahMenjawab) {

        return;

    }


    sudahMenjawab = true;


    const item =
        soal[nomor];


    const buttons =
        document.querySelectorAll(
            ".option"
        );


    const jawabanBenar =
        Number(
            item.jawaban
        );


    buttons.forEach(
        function(button, i) {

            button.disabled =
                true;


            if (
                i === jawabanBenar
            ) {

                button.classList.add(
                    "correct"
                );

            }

        }
    );


    const feedback =
        document.getElementById(
            "feedback"
        );


    if (
        Number(index) ===
        jawabanBenar
    ) {

        benar++;

        tambahEXP(
            EXP_PER_JAWABAN
        );


        buttons[index].classList.add(
            "correct"
        );


        feedback.innerHTML = `

            <div class="feedback">

                <h3>
                    ✅ Jawaban benar!
                </h3>

                <p>
                    +${EXP_PER_JAWABAN} EXP
                </p>

                <p>
                    ${
                        escapeHTML(
                            item.penjelasan ||
                            "Jawabanmu sesuai dengan materi."
                        )
                    }
                </p>

                <button
                    class="next-button"
                    type="button"
                    onclick="soalBerikutnya()"
                >
                    ${
                        nomor + 1 < soal.length
                            ? "Soal Berikutnya →"
                            : "Lihat Hasil →"
                    }
                </button>

            </div>

        `;

    } else {

        buttons[index].classList.add(
            "wrong"
        );


        feedback.innerHTML = `

            <div class="feedback">

                <h3>
                    ❌ Jawaban belum tepat
                </h3>

                <p>
                    Jawaban yang benar:
                    <strong>
                        ${
                            escapeHTML(
                                item.pilihan[
                                    jawabanBenar
                                ] || ""
                            )
                        }
                    </strong>
                </p>

                <p>
                    ${
                        escapeHTML(
                            item.penjelasan ||
                            "Pelajari kembali penjelasan materi."
                        )
                    }
                </p>

                <button
                    class="next-button"
                    type="button"
                    onclick="soalBerikutnya()"
                >
                    ${
                        nomor + 1 < soal.length
                            ? "Soal Berikutnya →"
                            : "Lihat Hasil →"
                    }
                </button>

            </div>

        `;

    }

}



function soalBerikutnya() {

    nomor++;

    tampilkanSoal();

}



function selesaiUjian() {

    const nilai =
        Math.round(
            (
                benar /
                soal.length
            ) * 100
        );


    simpanHasilUjian(
        nilai
    );


    document.getElementById(
        "app"
    ).innerHTML = `

        <div class="result">

            <h2>
                🏆 Ujian Selesai!
            </h2>


            <div class="result-score">

                ${nilai}

            </div>


            <p>
                ${benar}
                dari
                ${soal.length}
                jawaban benar.
            </p>


            <div class="result-exp">

                ⭐ +${expDidapat} EXP

            </div>


            <button
                type="button"
                onclick="mulaiUjian()"
            >
                🔄 Ulangi Ujian
            </button>


            <br><br>


            <button
                class="secondary"
                type="button"
                onclick="location.href='/progres'"
            >
                📊 Lihat Progres
            </button>


            <br><br>


            <button
                class="secondary"
                type="button"
                onclick="location.href='/menu'"
            >
                ← Kembali ke Menu
            </button>

        </div>

    `;

}



function simpanHasilUjian(nilai) {

    const aktifId =
        localStorage.getItem(
            "materiAktifId"
        );


    if (!aktifId) {

        return;

    }


    let daftar = [];


    try {

        daftar =
            JSON.parse(
                localStorage.getItem(
                    "materiSaya"
                ) || "[]"
            );

    } catch (error) {

        daftar = [];

    }


    if (!Array.isArray(daftar)) {

        return;

    }


    const item =
        daftar.find(
            function(data) {

                return String(
                    data.id
                ) === String(
                    aktifId
                );

            }
        );


    if (!item) {

        return;

    }


    item.skorUjian =
        nilai;


    item.ujianTerakhir =
        new Date().toISOString();


    item.expDidapat =
        Number(
            item.expDidapat || 0
        ) + expDidapat;


    item.sudahDipelajari =
        true;


    item.terakhirDipelajari =
        new Date().toISOString();


    localStorage.setItem(
        "materiSaya",
        JSON.stringify(
            daftar
        )
    );

}



function shuffle(array) {

    const hasil =
        [...array];


    for (
        let i = hasil.length - 1;
        i > 0;
        i--
    ) {

        const j =
            Math.floor(
                Math.random() *
                (i + 1)
            );


        [
            hasil[i],
            hasil[j]
        ] = [
            hasil[j],
            hasil[i]
        ];

    }


    return hasil;

}



function escapeHTML(teks) {

    return String(teks)

        .replaceAll(
            "&",
            "&amp;"
        )

        .replaceAll(
            "<",
            "&lt;"
        )

        .replaceAll(
            ">",
            "&gt;"
        )

        .replaceAll(
            '"',
            "&quot;"
        )

        .replaceAll(
            "'",
            "&#039;"
        );

}



updateTheme();


if (loadPaket()) {

    tampilkanMulai();

}

</script>

</body>

</html>
